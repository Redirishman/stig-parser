name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # The runner ships a setuptools older than the PYSEC-2026-3447 fix.
          # build-system.requires only governs the isolated build env, so the
          # ambient runtime copy must be upgraded here or the audit gate trips.
          pip install --upgrade "setuptools>=83.0.0"
          pip install -e ".[dev]"

      - name: Security audit (dependencies)
        run: pip-audit

      - name: Run tests
        run: pytest tests/ -v --tb=short
